services:
  api:
    build: .
    env_file: .env
    command: sh -c "python scripts/generate_sample_docs.py && python -m app.retrieval.ingest; uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    volumes: ["./data:/srv/data"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      retries: 10
  ui:
    build: .
    env_file: .env
    environment: [API_URL=http://api:8000]
    command: streamlit run ui/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports: ["8501:8501"]
    depends_on:
      api: { condition: service_healthy }
